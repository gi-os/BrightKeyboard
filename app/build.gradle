plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Resolved before the android block so both the signingConfig and the requireSigningKey task can see
// it. The key itself is never in the repository — CI decodes it from the KEYSTORE_BASE64 secret; see
// .github/workflows/build.yml, and the "Releases and signing" section of the README.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def resolvedKeystore = {
    def path = System.getenv('KEYSTORE_FILE') ?: keystoreProps['storeFile']
    path ? rootProject.file(path) : null
}()
def haveKeystore = resolvedKeystore != null && resolvedKeystore.exists()

/**
 * The GIF search key the app ships with, so GIFs work on a fresh install with nothing to set up.
 *
 * `local.properties` (git-ignored) for a local build, the `KLIPY_KEY` repository secret in CI.
 * Never committed: this repository is public, and a key in it is a key that gets scraped and
 * rate-limited for every user. An empty string is a perfectly good build — GIF search is then off
 * until somebody puts their own key in Settings, which is where it was before this existed.
 */
def klipyKey = {
    def local = rootProject.file('local.properties')
    def fromFile = null
    if (local.exists()) {
        def props = new Properties()
        local.withInputStream { props.load(it) }
        fromFile = props.getProperty('klipyKey')
    }
    fromFile ?: System.getenv('KLIPY_KEY') ?: ''
}()

/**
 * Scrambles the key so it is not a readable string in the shipped APK.
 *
 * XOR against a fixed pad, then Base64 — undone by `api/KlipyKey.kt`. Be clear about what this
 * buys: anything the app can decode, someone holding the APK can decode, because the pad is in the
 * same binary. What it stops is `strings app.apk | grep klipy` and the scrapers that walk public
 * repositories for things shaped like keys, which at this scale is the whole of the threat. The
 * real protection is that the key can be rotated and the next build carries the new one.
 */
static String scrambleKey(String value) {
    if (!value) return ''
    def pad = 'brightkeyboard'.getBytes('UTF-8')
    def bytes = value.getBytes('UTF-8')
    byte[] out = new byte[bytes.length]
    for (int i = 0; i < bytes.length; i++) out[i] = (byte) (bytes[i] ^ pad[i % pad.length])
    return Base64.encoder.encodeToString(out)
}

android {
    namespace 'app.lightphonekeyboard'
    compileSdk 35

    defaultConfig {
        // Not the package the sources live in, and deliberately so. `namespace` stays
        // app.lightphonekeyboard because it names the Kotlin package and moving it would rewrite
        // every file for no gain; the applicationId is the install identity, and that is the thing
        // that belonged to somebody else. See Migration.kt for what it cost and how it is handed
        // over.
        applicationId 'com.gios.brightkeyboard'
        minSdk 26
        targetSdk 35
        // CI derives these from the pushed Git tag (see .github/workflows/release.yml) so the APK's
        // embedded versionName always equals the GitHub release tag. Otherwise Obtainium compares the
        // tag against the stale embedded version and shows a phantom "update available" forever —
        // every v0.1.x release shipped embedded as 0.1.0, which is exactly that bug. The literals
        // below are only the fallback for local/debug builds, which have no tag.
        // CI passes these in: versionCode is the workflow run number (strictly increasing, so Android
        // always accepts the update) and versionName is 1.0.<run>, which equals the release tag. Keeping
        // them equal is what stops Obtainium comparing the tag against a stale embedded version and
        // showing a phantom "update available" forever.
        versionCode ((project.findProperty('appVersionCode') ?: '1').toString().toInteger())
        versionName (project.findProperty('appVersionName') ?: '1.0.0')
        resConfigs "en"

        // Light Phone 3 is arm64 — ship only its native libs (Vosk .so) to keep the APK small.
        ndk { abiFilters 'arm64-v8a' }

        // Scrambled, not encrypted — see scrambleKey above. Decoded by api/KlipyKey.kt.
        buildConfigField 'String', 'KLIPY_KEY', "\"${scrambleKey(klipyKey)}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // One stable signing key, for BOTH build types.
    //
    // Android identifies an app by (packageName, signing certificate), so every build that could ever
    // replace another has to carry the same certificate. Two ways to get this wrong, and this file used
    // to manage both:
    //
    //   - Letting `assembleDebug` fall back to the default ~/.android/debug.keystore. A fresh CI runner
    //     generates that from scratch on every job, so consecutive builds carry different certificates
    //     and Android rejects the update as invalid.
    //   - Gating the release signingConfig on an env var and silently producing an UNSIGNED apk when it
    //     is absent. An unsigned apk cannot install at all, and nothing in the build log says so.
    //
    // The key itself is not in the repository — it is a base64 repo secret that CI decodes to a temp
    // file (see .github/workflows/build.yml). Locally, point KEYSTORE_FILE at your copy, or drop a
    // keystore.properties in the project root with storeFile/storePassword/keyAlias/keyPassword.
    signingConfigs {
        release {
            if (haveKeystore) {
                storeFile resolvedKeystore
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: keystoreProps['storePassword']
                keyAlias System.getenv('KEY_ALIAS') ?: keystoreProps['keyAlias']
                keyPassword System.getenv('KEY_PASSWORD') ?: keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        // Debug shares the release key when one is available — and keeps the same applicationId, with
        // no `.debug` suffix — so `adb install -r` replaces an installed release in place rather than
        // leaving a second Bright Keyboard in the input-method list. Without a key it falls back to the
        // normal debug signing, so anyone can still clone and build.
        debug {
            if (haveKeystore) signingConfig signingConfigs.release
        }
        release {
            // Signing is mandatory here, enforced by the requireSigningKey task below rather than by a
            // throw at this point: throwing during configuration fails EVERY gradle invocation without
            // a key, including `assembleDebug` and the unit tests, which would stop anyone cloning the
            // repo from building it at all.
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { buildConfig true }
    lint { abortOnError false }
}

// Refuse to assemble a release without a signing key, instead of quietly emitting an unsigned APK.
// An unsigned APK looks exactly like a good one — same size, same name, builds green — and only reveals
// itself by refusing to install, with no useful error. Upstream shipped that state for 11 builds.
tasks.register('requireSigningKey') {
    doLast {
        if (!haveKeystore) {
            throw new GradleException(
                "No signing key: set KEYSTORE_FILE (+ KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD) " +
                "or create keystore.properties. Release builds are never left unsigned, because an " +
                "unsigned APK cannot be installed at all.")
        }
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach { dependsOn 'requireSigningKey' }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Offline on-device speech recognition. The native libs ship in the APK (~10MB); the language
    // model is NOT bundled — it's downloaded on demand when the user turns on voice dictation.
    implementation 'com.alphacephei:vosk-android:0.3.47'
    // Runs the swipe model (assets/swipe/encoder.pte). ~4 MB of arm64 native library after
    // compression; abiFilters above keeps the other architectures out. See SwipeEncoder.
    implementation 'org.pytorch:executorch-android:1.4.0'

    testImplementation 'junit:junit:4.13.2'   // JVM unit tests for the pure TouchModel logic
    // A real org.json on the *unit test* classpath only. The platform provides org.json at runtime,
    // so the APK never bundles it — but the android.jar these tests compile against is the stub
    // one, whose every method throws "Stub!". Without this, everything that parses a GIF answer
    // fails with a RuntimeException that says nothing about JSON. Not `implementation`: a second
    // copy of these classes in the APK fails the build on duplicates.
    testImplementation 'org.json:json:20240303'
}
