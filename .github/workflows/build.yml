# Test, build, and publish a signed APK — on every push to main.
#
# Releasing per push rather than per tag is deliberate: tagging is a separate step that is easy to
# forget, and a release that never gets cut is a fix that never reaches the phone. The trade is that
# main has to stay green, which is what the test job below is for.
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two pushes in quick succession would otherwise race to create the same release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Empty on purpose. The action's default is to install the legacy `tools` package, which
          # Google withdrew from the SDK repository — sdkmanager answers "Failed to find package
          # 'tools'" and exits 1, failing every Android build from 2026-09-14 on. Gradle resolves the
          # platform and build-tools it needs by itself.
          packages: ''

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Every build has to be signed with the same key"
            echo "::error::or Android refuses the update; there is no unsigned fallback on purpose."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Version from the run number
        id: version
        run: |
          # versionCode must strictly increase for Android to accept an update; the run number does
          # that for free. versionName is kept equal to the release tag so Obtainium compares like
          # with like — a mismatch there shows as a permanent phantom "update available".
          # 3.0: the keyboard the Bright* set ships now — a neural swipe decoder, a tools page,
          # a clipboard, one-handed mode and a GIF picker, none of which the 1.x line had.
          # 3.1: per-key touch targets, learned from the typist and invisible.
          # 3.2: a settings page that draws them, and the fix that made 3.1 actually persist.
          # 3.3: that overlay moved onto the real keys, where the geometry already is.
          # 3.4: space/return/delete learn too, and the letters can be taken off the keys.
          # 3.5: shift and 123 learn as well, and the delete signal works again.
          # 3.6: delete after a swipe can take the whole traced word out.
          # 3.7: import a word list, and fold accents so accented words work at all.
          # 3.8: six downloadable language packs, plus AOSP .combined as a pack source.
          # 3.9: search the AOSP dictionary repo from the phone; several languages at once.
          # 3.10: drag and pinch the keyboard to size; Indonesian and Icelandic packs.
          # 3.11: the last release under app.lightphonekeyboard. The id belongs to the project this
          #       keyboard was forked from and is going back to it; this build carries the notice
          #       and the provider that hands settings, saved words and the touch model to 4.0.
          # 4.0: the applicationId is com.gios.brightkeyboard. Same keyboard, new install identity,
          #      and it reads 3.11's settings, saved words and touch model across on first launch.
          # 4.1: a language change actually reloads the dictionary and character model.
          # 4.2: text faces — a Faces tile on the tools page, and your own kept in settings.
          # 4.3: a tap on a drawn control key types that key; the space bar's learned reach is capped.
          # 4.4: no autocorrect or completions in an address, email, password or filter field.
          # CI reads only major.minor from here, so this line is where a feature release is declared.
          echo "name=4.4.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The typing logic (dictionary, autocorrect, swipe decoding) is pure Kotlin with no Android
      # types precisely so it can be tested here, on the real 63k-word dictionary, rather than only
      # on a phone. A failure here stops the release.
      # Says out loud whether the GIF key will be in this build. It cannot fail the build — a fork
      # has no secrets and must still be buildable, and the picker degrades to "add a key in
      # Settings" — but a release that silently shipped without one is the kind of thing nobody
      # notices until a user says GIFs do not work.
      - name: Is the GIF key in this build?
        env:
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
        run: |
          if [ -n "${KLIPY_KEY:-}" ]; then
            echo "KLIPY_KEY is set (${#KLIPY_KEY} characters); GIF search will work out of the box."
          else
            echo "::warning::KLIPY_KEY is not set. This APK ships without a GIF key, and the"
            echo "::warning::picker will ask each user to add their own in Settings."
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Read by app/build.gradle and scrambled into BuildConfig. A secret that exists in the
          # repository but is not named here does not reach Gradle at all: getenv returns null, the
          # build stays green, and the shipped APK asks every user for a key. See the check below.
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
        run: >-
          ./gradlew :app:assembleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Check the signing certificate hasn't changed
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          # The output line reads "Signer #1 certificate SHA-256 digest: <hex>", so splitting on
          # ': ' returns the label rather than the hex — strip everything up to the digest instead.
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':' | tr 'A-Z' 'a-z')
          EXPECTED=$(tr -d '[:space:]' < signing-fingerprint.txt | tr 'A-Z' 'a-z')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate changed. Android identifies an app by (package, cert),"
            echo "::error::so shipping this would break updates for anyone who already has the app."
            exit 1
          fi

      - name: Stage the release APK
        id: stage
        run: |
          mkdir -p dist
          # Exactly ONE apk per release. Publishing more than one lets Obtainium pick the wrong asset.
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/BrightKeyboard-v${{ steps.version.outputs.name }}.apk"
          ls -la dist

      # Debug stays a workflow artifact and is never attached to a release, for the same reason.
      - name: Build debug APK
        if: github.event_name == 'pull_request'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          files: dist/BrightKeyboard-*.apk
          make_latest: true
          generate_release_notes: true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
